[versions]
# Kotlin/Native gained Xcode 26 support in 2.2.21. Anything older writes error
# nodes into the klib for Apple symbols it cannot resolve, and the framework
# link step then refuses to deserialize them.
kotlin = "2.4.10"
compose = "1.11.0"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
