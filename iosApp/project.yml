# Fallback: regenerate iosApp.xcodeproj from scratch with XcodeGen.
#   brew install xcodegen && cd iosApp && xcodegen generate
# Only needed if the checked-in .xcodeproj ever gets corrupted or you want to
# retarget it. The committed project is the source of truth day to day.

name: iosApp
options:
  bundleIdPrefix: app.odyssey
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.odyssey.myodyssey
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ -z "$JAVA_HOME" ]; then export JAVA_HOME=$(/usr/libexec/java_home); fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
